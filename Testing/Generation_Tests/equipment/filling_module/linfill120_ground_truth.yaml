asset_name: "LinFill120"
description: |
  Ground truth for the LinFill-120 Vertical Syringe Filling Station (Elara Automation GmbH).
  Derived from EA-LC-LF120-EN Rev. 1.1 (lifecycle), EA-LN-SPL01-EN (BOM), and
  EA-MI-LF120-EN Rev. 2.0 (MQTT interface: per-action CMD/DATA topic pairs,
  Uuid-correlated JSON payloads, QoS 2).
  Covers all six selected submodels: Nameplate, HierarchicalStructures, AID,
  Skills, Capabilities, OperationalData.

  Unlike the old rubric-style ground truth, `profile` below is a real profile
  document -- the exact same shape profile_document_to_aas_json consumes. The
  evaluation harness builds it into a genuine reference AAS via that same
  pipeline and diffs the generated AAS against it, so this ground truth can
  never structurally drift from what the pipeline actually produces (the bug
  class that motivated this rewrite: the old YAML described an AID/Skills
  shape the real builders had already stopped matching).

# ── Scoring hints ────────────────────────────────────────────────────────────
# required_paths: "SubmodelIdShort/idShort/idShort/..." -- hard requirements;
# penalised if missing from the generated AAS. Everything else present in
# `profile` below is still scored (via value_substring_match) but not
# penalised if the model omits it -- mirrors the old ground truth's
# "required: false" fields, just inverted (list the few required ones instead
# of the many optional ones, since a profile has nowhere to hang a per-field
# required/optional flag the way the old rubric format did).
required_paths:
  - "DigitalNameplate/ManufacturerName"
  - "DigitalNameplate/ManufacturerProductDesignation"
  - "DigitalNameplate/ContactInformation"
  - "DigitalNameplate/OrderCodeOfManufacturer"
  - "DigitalNameplate/SerialNumber"
  - "HierarchicalStructures/ArcheType"
  - "HierarchicalStructures/EntryNode"
  - "AID/InterfaceMQTT"
  - "AID/InterfaceMQTT/EndpointMetadata"
  - "AID/InterfaceMQTT/InteractionMetadata"
  - "Skills/Skills/Start"
  - "Skills/Skills/Stop"
  - "Skills/Skills/Home"
  - "Capabilities/CapabilitySet/SyringeFillingContainer"
  - "OperationalData/State"

must_not_contain:
  - "opc.tcp"
  - "OPC UA"
  - "NodeId"
  - "BrowseName"
  - "ns=1"
  - "PlungerSet"

# ── Reference profile ────────────────────────────────────────────────────────
# Fed straight into profile_document_to_aas_json -- must stay buildable.
profile:
  LinFill120AAS:
    idShort: "LinFill120AAS"
    id: "/aas/LinFill120AAS"
    globalAssetId: "/assets/LinFill120"
    assetType: "/Resource/filling-station/syringe"
    serialNumber: "EA-LF-2024-00472"
    location: "AAU SmartProduction Laboratory, SPL-01 Pilot Aseptic Syringe Filling Line, Station 1"

    DigitalNameplate:
      ManufacturerName: "Elara Automation GmbH"
      SerialNumber: "EA-LF-2024-00472"
      ManufacturerProductDesignation: "LinFill-120 Vertical Syringe Filling Station"
      OrderCodeOfManufacturer: "EA-LF120-230V-EU"
      AddressInformation:
        Street: "Brückenstraße 14"
        ZipCode: "70173"
        CityTown: "Stuttgart"
        NationalCode: "DE"
      YearOfConstruction: "2024"
      DateOfManufacture: "2024-03-15"
      CountryOfOrigin: "DE"
      HardwareVersion: "2.1"
      SoftwareVersion: "1.5.0"
      ManufacturerProductFamily: "LinFill Series"
      URIOfTheProduct: "https://smartproductionlab.aau.dk/assets/linfill-120"

    HierarchicalStructures:
      Name: "BillOfMaterials"
      Archetype: "OneDown"
      HasPart:
        ESP32ControllerModule:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/ESP32ControllerModule"
        L298NMotorControllerBoard:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/L298NMotorControllerBoard"
        LiftMotor:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/LiftMotor"
        LeadScrewAssembly:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/LeadScrewAssembly"
        HomingLimitSwitch:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/HomingLimitSwitch"
        TopLimitSwitch:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/TopLimitSwitch"
        RemovableNeedleTopAssembly:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/RemovableNeedleTopAssembly"

    # Per-action CMD (invoke) / DATA (response) topic pairs, Uuid-correlated
    # JSON payloads, QoS 2 -- matches the real InnoLab MQTT_classes pattern.
    # forms.response nests the DATA topic under the action's CMD-topic forms
    # (see json_description_generation.py's AID guide for this convention).
    AID:
      InterfaceMQTT:
        protocol: "MQTT"
        Title: "LinFill-120 MQTT Interface"
        EndpointMetadata:
          base: "mqtt://broker:1883"
          contentType: "application/json"
        InteractionMetadata:
          actions:
            Start:
              key: "start"
              title: "Start fill cycle"
              synchronous: "true"
              forms:
                href: "CMD/Start"
                contentType: "application/json"
                response: {href: "DATA/Start", contentType: "application/json"}
            Stop:
              key: "stop"
              title: "Stop active fill cycle"
              synchronous: "true"
              forms:
                href: "CMD/Stop"
                contentType: "application/json"
                response: {href: "DATA/Stop", contentType: "application/json"}
            Home:
              key: "home"
              title: "Home the lift"
              synchronous: "true"
              forms:
                href: "CMD/Home"
                contentType: "application/json"
                response: {href: "DATA/Home", contentType: "application/json"}
            Reset:
              key: "reset"
              title: "Reset fault state"
              synchronous: "true"
              forms:
                href: "CMD/Reset"
                contentType: "application/json"
                response: {href: "DATA/Reset", contentType: "application/json"}
          properties:
            State:
              key: "state"
              title: "Operational state (IDLE/RUNNING/ERROR/HOMING)"
              forms: {href: "DATA/State", contentType: "application/json"}
            Weight:
              key: "weight"
              title: "Streamed syringe weight reading"
              forms: {href: "DATA/Weight", contentType: "application/json"}
            # CycleTime is semantically a one-shot notification (WoT
            # EventAffordance would be the "proper" fit), but it must live
            # under 'properties' here: variables_builder.py's
            # _create_interface_reference hardcodes its ModelReference chain
            # to always end at .../InteractionMetadata/properties/{name}, so
            # an OperationalData variable can only ever reference an AID
            # property, never an action or event. Modelling it as an event
            # would make this ground truth unbuildable/SHACL-invalid.
            CycleTime:
              key: "cycletime"
              title: "Cycle duration, published once per completed cycle"
              forms: {href: "DATA/CycleTime", contentType: "application/json"}

    Skills:
      Start:
        interface: "Start"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Start"
      Stop:
        interface: "Stop"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Stop"
      Home:
        interface: "Home"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Home"
      Reset:
        interface: "Reset"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Reset"

    Capabilities:
      SyringeFilling:
        realizedBy: "Start"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/SyringeFilling"
      CycleStopping:
        realizedBy: "Stop"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/CycleStopping"
      LiftHoming:
        realizedBy: "Home"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/LiftHoming"
      FaultResetting:
        realizedBy: "Reset"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/FaultResetting"

    Variables:
      State:
        InterfaceReference: "State"
        semanticId: "https://smartproductionlab.aau.dk/variables/State"
      CycleTime:
        InterfaceReference: "CycleTime"
        semanticId: "https://smartproductionlab.aau.dk/variables/CycleTime"
      Weight:
        InterfaceReference: "Weight"
        semanticId: "https://smartproductionlab.aau.dk/variables/Weight"
