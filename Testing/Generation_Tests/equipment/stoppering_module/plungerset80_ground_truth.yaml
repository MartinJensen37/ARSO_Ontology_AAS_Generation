asset_name: "PlungerSet80"
description: |
  Ground truth for the PlungerSet-80 Automated Stoppering Station (Elara Automation GmbH).
  Derived from EA-LC-PS080-EN Rev. 1.0 (lifecycle) and EA-NS-PS080.NodeSet2.xml
  Rev. 1.0 (OPC UA NodeSet). Communication protocol: OPC UA TCP Binary (port
  4840), security mode SignAndEncrypt. Namespace URI
  http://elara-automation.de/UA/PlungerSet80/ (index 1 at runtime).

  `profile` below is a real profile document -- the exact same shape
  profile_document_to_aas_json consumes -- built into a genuine reference AAS
  by the evaluation harness via that same pipeline (see
  Testing/Generation_Tests/Test_Scripts/run_eval.py::_build_reference_aas).
  Same rationale and format as linfill120_ground_truth.yaml (filling_module);
  see that file for the fuller explanation of why this replaced the old
  rubric-style YAML.

  Every opc_node_id below is the exact numeric NodeId already defined in
  EA-NS-PS080.NodeSet2.xml (Variables i=3010-3015/3030-3031, Methods
  i=4010-4013) -- kept in lockstep with that file rather than invented here.

# ── Scoring hints ────────────────────────────────────────────────────────────
# See linfill120_ground_truth.yaml for the required_paths/must_not_contain
# convention (profiles have nowhere to hang a per-field required/optional
# flag, so it lives here instead; everything else in `profile` is still
# scored via value_substring_match, just not penalised if missing).
required_paths:
  - "DigitalNameplate/ManufacturerName"
  - "DigitalNameplate/ManufacturerProductDesignation"
  - "DigitalNameplate/ContactInformation"
  - "DigitalNameplate/OrderCodeOfManufacturer"
  - "DigitalNameplate/SerialNumber"
  - "HierarchicalStructures/ArcheType"
  - "HierarchicalStructures/EntryNode"
  - "AID/InterfaceOPCUA"
  - "AID/InterfaceOPCUA/EndpointMetadata"
  - "AID/InterfaceOPCUA/InteractionMetadata"
  - "Skills/Skills/Start"
  - "Skills/Skills/Stop"
  - "Skills/Skills/Home"
  - "Capabilities/CapabilitySet/PlungerInsertionContainer"
  - "OperationalData/State"

must_not_contain:
  - "MQTT"
  - "mqtt"
  - "{base}/filling"
  - "syringeweight"
  - "LinFill"
  - "linfill120"
  - "broker"

# ── Reference profile ────────────────────────────────────────────────────────
profile:
  PlungerSet80AAS:
    idShort: "PlungerSet80AAS"
    id: "/aas/PlungerSet80AAS"
    globalAssetId: "/assets/PlungerSet80"
    assetType: "/Resource/stoppering-station/plunger"
    serialNumber: "EA-PS-2024-00391"
    location: "AAU SmartProduction Laboratory, SPL-01 Pilot Aseptic Syringe Filling Line, Station 2"

    DigitalNameplate:
      ManufacturerName: "Elara Automation GmbH"
      SerialNumber: "EA-PS-2024-00391"
      ManufacturerProductDesignation: "PlungerSet-80 Automated Stoppering Station"
      OrderCodeOfManufacturer: "EA-PS080-230V-EU"
      AddressInformation:
        Street: "Brückenstraße 14"
        ZipCode: "70173"
        CityTown: "Stuttgart"
        NationalCode: "DE"
      YearOfConstruction: "2024"
      DateOfManufacture: "2024-03-22"
      CountryOfOrigin: "DE"
      HardwareVersion: "1.3"
      SoftwareVersion: "1.4.2"
      ManufacturerProductFamily: "PlungerSet Series"
      URIOfTheProduct: "https://smartproductionlab.aau.dk/assets/plungerset-80"

    HierarchicalStructures:
      Name: "BillOfMaterials"
      Archetype: "OneDown"
      HasPart:
        ESP32ControllerModule:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/ESP32ControllerModule-PS080"
        MotorControllerBoard:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/MotorControllerBoard"
        LiftMotor:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/LiftMotor-PS080"
        LeadScrewAssembly:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/LeadScrewAssembly-PS080"
        LinearInsertActuator:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/LinearInsertActuator"
        ServoFeedMotor:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/ServoFeedMotor"
        GearDriveAssembly:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/GearDriveAssembly"
        HomingLimitSwitch:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/HomingLimitSwitch-PS080"
        PlungerMagazineAssembly:
          globalAssetId: "https://smartproductionlab.aau.dk/assets/PlungerMagazineAssembly"

    # OPC UA TCP Binary, port 4840, SignAndEncrypt/Basic256Sha256, namespace
    # index 1 -- EndpointMetadata field names are the exact set
    # asset_interfaces_builder.py::_create_opcua_endpoint_metadata reads
    # (protocol/encoding/base/port/security_mode/security_policy/
    # namespace_uri/namespace_index), confirmed against the source. Each
    # action/property's Forms use opc_node_id + opc_namespace (arso:aid.ttl's
    # UavNodeIdProperty/UavNamespaceProperty), reusing the exact numeric
    # NodeIds already defined in EA-NS-PS080.NodeSet2.xml.
    AID:
      InterfaceOPCUA:
        protocol: "OPCUA"
        Title: "PlungerSet-80 OPC UA Interface"
        EndpointMetadata:
          protocol: "OPC UA"
          encoding: "TCP Binary"
          base: "opc.tcp://plungerset80-EA-PS-2024-00391.local:4840"
          port: "4840"
          security_mode: "SignAndEncrypt"
          security_policy: "Basic256Sha256"
          namespace_uri: "http://elara-automation.de/UA/PlungerSet80/"
          namespace_index: "1"
        InteractionMetadata:
          actions:
            Start:
              key: "start"
              title: "Start stoppering cycle"
              synchronous: "true"
              forms: {opc_node_id: "ns=1;i=4010", opc_namespace: "1"}
            Stop:
              key: "stop"
              title: "Stop active stoppering cycle"
              synchronous: "true"
              forms: {opc_node_id: "ns=1;i=4011", opc_namespace: "1"}
            Home:
              key: "home"
              title: "Home the lift"
              synchronous: "true"
              forms: {opc_node_id: "ns=1;i=4012", opc_namespace: "1"}
            Reset:
              key: "reset"
              title: "Reset fault state"
              synchronous: "true"
              forms: {opc_node_id: "ns=1;i=4013", opc_namespace: "1"}
          properties:
            State:
              key: "state"
              title: "Operational state (IDLE/RUNNING/ERROR/HOMING)"
              forms: {opc_node_id: "ns=1;i=3010", opc_namespace: "1"}
            CycleTime:
              key: "cycletime"
              title: "Cycle duration in seconds"
              forms: {opc_node_id: "ns=1;i=3011", opc_namespace: "1"}
            MagazineCount:
              key: "magazinecount"
              title: "Remaining plungers in magazine (0-4 standard, 0-8 extended)"
              forms: {opc_node_id: "ns=1;i=3012", opc_namespace: "1"}
            FirmwareVersion:
              key: "firmwareversion"
              title: "Device firmware version"
              forms: {opc_node_id: "ns=1;i=3013", opc_namespace: "1"}
            ErrorCode:
              key: "errorcode"
              title: "Fault bitmask (UInt32): homing/insertion/servo/magazine/comms/retract"
              forms: {opc_node_id: "ns=1;i=3015", opc_namespace: "1"}
            TotalCycles:
              key: "totalcycles"
              title: "Lifetime completed cycle count (non-volatile)"
              forms: {opc_node_id: "ns=1;i=3030", opc_namespace: "1"}
            UptimeSeconds:
              key: "uptimeseconds"
              title: "Seconds since last power-on"
              forms: {opc_node_id: "ns=1;i=3031", opc_namespace: "1"}

    Skills:
      Start:
        interface: "Start"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Start"
      Stop:
        interface: "Stop"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Stop"
      Home:
        interface: "Home"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Home"
      Reset:
        interface: "Reset"
        semantic_id: "https://smartproductionlab.aau.dk/skills/Reset"

    Capabilities:
      PlungerInsertion:
        realizedBy: "Start"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/PlungerInsertion"
      CycleStopping:
        realizedBy: "Stop"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/CycleStopping"
      LiftHoming:
        realizedBy: "Home"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/LiftHoming"
      FaultResetting:
        realizedBy: "Reset"
        semantic_id: "https://smartproductionlab.aau.dk/Capability/FaultResetting"

    Variables:
      State:
        InterfaceReference: "State"
        semanticId: "https://smartproductionlab.aau.dk/variables/State"
      CycleTime:
        InterfaceReference: "CycleTime"
        semanticId: "https://smartproductionlab.aau.dk/variables/CycleTime"
